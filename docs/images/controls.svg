<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
  <title id="title">MGS5VR: Quest Touch quick controls</title>
  <desc id="desc">On-foot controls, Action Type layout. Enter VR with left grip and left-stick click after loading a save. Left stick moves; right stick turns. Hold right grip to ready, right trigger to fire. Hold left trigger for the wrist picker: flick the right stick up for primary, down for secondary, right for support or left for items; wait for cards, center, flick toward a card, and release left trigger. A uses an item; B goes back. Full controls and limitations are in CONTROLS.md.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #edf3f6; }
      .muted { fill: #afc0cd; }
      .small { font-size: 19px; }
      .body { font-size: 22px; }
      .label { font-size: 22px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .left { fill: #73e2c1; }
      .right { fill: #ffcb8b; }
    </style>
  </defs>
  <rect width="1120" height="1080" rx="24" fill="#101a24"/>
  <text x="40" y="56" font-size="34" font-weight="750">MGS5VR</text>
  <text x="236" y="55" font-size="27" class="muted">Your controls, at a glance</text>
  <text x="40" y="89" class="small muted">QUEST TOUCH · ON FOOT · ACTION TYPE LAYOUT</text>
  <rect x="40" y="112" width="1040" height="70" rx="13" fill="#233641"/>
  <text x="62" y="142" class="label left">ENTER / LEAVE VR</text>
  <text x="339" y="142" class="label">Hold left grip + click left stick</text>
  <text x="339" y="166" class="small muted">Load Continue → Resume Game first.</text>

  <rect x="40" y="204" width="508" height="382" rx="16" fill="#1b2a35"/>
  <rect x="572" y="204" width="508" height="382" rx="16" fill="#1b2a35"/>
  <text x="64" y="247" class="section left">LEFT HAND</text>
  <text x="596" y="247" class="section right">RIGHT HAND</text>
  <path d="M460 224 C439 225 438 244 445 258 L456 287 Q462 302 473 292 L493 260 C506 240 488 220 460 224Z" fill="#304854" stroke="#73e2c1" stroke-width="2"/>
  <circle cx="456" cy="243" r="8" fill="#73e2c1"/>
  <circle cx="483" cy="241" r="5" fill="#101a24"/>
  <circle cx="474" cy="255" r="5" fill="#101a24"/>
  <path d="M1000 224 C1021 225 1022 244 1015 258 L1004 287 Q998 302 987 292 L967 260 C954 240 972 220 1000 224Z" fill="#304854" stroke="#ffcb8b" stroke-width="2"/>
  <circle cx="1004" cy="243" r="8" fill="#ffcb8b"/>
  <circle cx="977" cy="241" r="5" fill="#101a24"/>
  <circle cx="986" cy="255" r="5" fill="#101a24"/>

  <text x="64" y="298" class="label">Stick</text><text x="233" y="298" class="body">Move</text>
  <text x="64" y="337" class="label">Stick click</text><text x="233" y="337" class="body">Sprint (grip released)</text>
  <text x="64" y="376" class="label left">Trigger</text><text x="233" y="376" class="body">Hold for wrist picker</text>
  <text x="64" y="415" class="label">Y</text><text x="233" y="415" class="body">Interact / pick up</text>
  <text x="64" y="454" class="label">X</text><text x="233" y="454" class="body">Quick dive</text>
  <text x="64" y="493" class="label">Menu</text><text x="233" y="493" class="body">Tap: iDroid</text>
  <text x="233" y="523" class="body">Hold: pause</text>
  <text x="64" y="562" class="small muted">Raise your left forearm to read the HUD.</text>

  <text x="596" y="298" class="label">Stick</text><text x="755" y="298" class="body">Turn</text>
  <text x="596" y="337" class="label right">Grip</text><text x="755" y="337" class="body">Hold: ready weapon</text>
  <text x="596" y="376" class="label right">Trigger</text><text x="755" y="376" class="body">Fire / throw</text>
  <text x="755" y="403" class="small muted">With right grip held</text>
  <text x="596" y="445" class="label">B</text><text x="755" y="445" class="body">Reload</text>
  <text x="596" y="484" class="label">A</text><text x="755" y="484" class="body">Tap: crouch</text>
  <text x="755" y="514" class="body">Hold: prone</text>
  <text x="755" y="541" class="small muted">Release right grip first</text>
  <text x="596" y="570" class="small muted">Trigger = index finger. Grip = side button.</text>

  <rect x="40" y="608" width="1040" height="290" rx="16" fill="#203b3e"/>
  <text x="64" y="650" class="section left">WRIST PICKER</text>
  <text x="330" y="650" class="body">Keep holding LEFT TRIGGER through steps 1 and 2.</text>
  <circle cx="82" cy="695" r="18" fill="#73e2c1"/><text x="76" y="703" font-size="22" font-weight="700" style="fill:#101a24">1</text>
  <text x="112" y="703" class="label">Flick RIGHT STICK to a category</text>
  <text x="224" y="740" class="body" text-anchor="middle">↑ Primary</text>
  <text x="143" y="777" class="body" text-anchor="middle">← Items</text>
  <text x="360" y="777" class="body" text-anchor="middle">Support →</text>
  <text x="224" y="814" class="body" text-anchor="middle">↓ Secondary</text>
  <path d="M491 681 V831" stroke="#527071" stroke-width="2"/>
  <circle cx="538" cy="695" r="18" fill="#73e2c1"/><text x="532" y="703" font-size="22" font-weight="700" style="fill:#101a24">2</text>
  <text x="568" y="703" class="label">Wait for cards. Center the stick.</text>
  <text x="538" y="743" class="body">Flick toward a card (diagonals work too).</text>
  <text x="538" y="782" class="label left">Release LEFT TRIGGER to finish.</text>
  <text x="538" y="821" class="body">Right A: use item · Right B: categories</text>
  <path d="M64 842 H1056" stroke="#527071"/>
  <text x="64" y="875" class="body">Left stick still moves you. The wrist picker does not pause the game.</text>

  <text x="40" y="937" class="label left">TWO-HANDED</text>
  <text x="230" y="937" class="body">Bring your left palm to the weapon. Pull away to release.</text>
  <text x="40" y="978" class="label right">GRENADE</text>
  <text x="230" y="978" class="body">Hold right grip; point / tilt your right hand. Right trigger throws.</text>
  <text x="40" y="1028" class="small muted">Binocular zoom, physical punches and full buddy-command navigation are unfinished.</text>
  <text x="40" y="1056" class="small muted">Experimental · 2026-09-08 · Full controls and riding/menu differences: docs/CONTROLS.md</text>
</svg>
