<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3173" viewBox="0 0 1440 3173" role="img" aria-labelledby="title desc"><title id="title">MGS5VR complete controller modes</title><desc id="desc">Experimental / 13 September 2026 / Quest Touch / Action Type</desc><rect width="1440" height="3173" fill="#f2efe5"/><g font-family="Arial, Helvetica, sans-serif"><rect x="40" y="40" width="12" height="84" fill="#af2624"/><text x="76" y="83" font-size="44" font-weight="900" fill="#252625">MGS5VR / CONTROL MODES</text><text x="77" y="119" font-size="20" font-weight="400" fill="#252625">Experimental / 13 September 2026 / Quest Touch / Action Type</text><rect x="40" y="164" width="1360" height="48" fill="#272928"/><text x="61" y="197" font-size="24" font-weight="800" fill="#fffaf0">01 / MOVE &amp; HANDLE WEAPONS</text><text x="62" y="238" font-size="21" font-weight="700" fill="#252625">Left stick / right-stick click</text><text x="496" y="238" font-size="21" font-weight="400" fill="#252625">Move / dive; click means press inward</text><text x="62" y="276" font-size="21" font-weight="700" fill="#252625">Right stick left-right / left</text><text x="62" y="301" font-size="21" font-weight="700" fill="#252625">click</text><text x="496" y="276" font-size="21" font-weight="400" fill="#252625">Turn / sprint; right-stick up is unassigned on foot</text><text x="62" y="339" font-size="21" font-weight="700" fill="#252625">Right stick down</text><text x="496" y="339" font-size="21" font-weight="400" fill="#252625">Tap: crouch or stand / Hold: prone</text><text x="62" y="377" font-size="21" font-weight="700" fill="#252625">Right grip / trigger</text><text x="496" y="377" font-size="21" font-weight="400" fill="#252625">Hold to ready / fire or throw</text><text x="62" y="415" font-size="21" font-weight="700" fill="#252625">Left grip near support socket</text><text x="496" y="415" font-size="21" font-weight="400" fill="#252625">Guide the barrel with two hands; release grip or pull away</text><text x="62" y="453" font-size="21" font-weight="700" fill="#252625">Short B tap / hold B</text><text x="496" y="453" font-size="21" font-weight="400" fill="#252625">Reload / equip binoculars</text><text x="62" y="491" font-size="21" font-weight="700" fill="#252625">Hold left grip, then hold B</text><text x="496" y="491" font-size="21" font-weight="400" fill="#252625">Pick up a weapon / carry a person at the native prompt</text><text x="62" y="529" font-size="21" font-weight="700" fill="#252625">Y / A while readied / hold X</text><text x="496" y="529" font-size="21" font-weight="400" fill="#252625">Native interaction / quick weapon switch / Commands</text><text x="62" y="567" font-size="21" font-weight="700" fill="#252625">Right grip + left-stick click</text><text x="496" y="567" font-size="21" font-weight="400" fill="#252625">Physical scope zoom; consumes sprint while held</text><text x="62" y="605" font-size="21" font-weight="700" fill="#252625">C4 or decoy: right grip + Y</text><text x="496" y="605" font-size="21" font-weight="400" fill="#252625">Detonate placed C4 / inflate thrown decoys; trigger places or throws first</text><text x="62" y="643" font-size="21" font-weight="700" fill="#252625">Grip, trigger and touch</text><text x="496" y="643" font-size="21" font-weight="400" fill="#252625">Articulate fingers; weapons retain their authored grip</text><rect x="40" y="702" width="1360" height="48" fill="#272928"/><text x="61" y="735" font-size="24" font-weight="800" fill="#fffaf0">02 / LEFT-WRIST EQUIPMENT</text><text x="62" y="776" font-size="21" font-weight="700" fill="#252625">Hold left trigger</text><text x="496" y="776" font-size="21" font-weight="400" fill="#252625">Unfold wrist display and wait for your choice; left stick still moves you</text><text x="62" y="814" font-size="21" font-weight="700" fill="#252625">First right-stick flick</text><text x="496" y="814" font-size="21" font-weight="400" fill="#252625">Up: primary / Down: secondary / Right: support / Left: items</text><text x="62" y="852" font-size="21" font-weight="700" fill="#252625">Center, then flick to a card</text><text x="496" y="852" font-size="21" font-weight="400" fill="#252625">All eight directions work; center between choices</text><text x="62" y="890" font-size="21" font-weight="700" fill="#252625">Release left trigger</text><text x="496" y="890" font-size="21" font-weight="400" fill="#252625">Equip and close</text><text x="62" y="928" font-size="21" font-weight="700" fill="#252625">B / A</text><text x="496" y="928" font-size="21" font-weight="400" fill="#252625">Back to categories / Use selected item</text><text x="62" y="966" font-size="21" font-weight="700" fill="#252625">Items &gt; NVG / None</text><text x="496" y="966" font-size="21" font-weight="400" fill="#252625">Night vision on / off</text><rect x="40" y="1025" width="1360" height="48" fill="#272928"/><text x="61" y="1058" font-size="24" font-weight="800" fill="#fffaf0">03 / COMMANDS &amp; RECON</text><text x="62" y="1099" font-size="21" font-weight="700" fill="#252625">Hold X</text><text x="496" y="1099" font-size="21" font-weight="400" fill="#252625">Open wrist Commands; horseback uses LT + X</text><text x="62" y="1137" font-size="21" font-weight="700" fill="#252625">Center right stick; point</text><text x="496" y="1137" font-size="21" font-weight="400" fill="#252625">Choose an available buddy or arm command</text><text x="62" y="1175" font-size="21" font-weight="700" fill="#252625">A / release X</text><text x="496" y="1175" font-size="21" font-weight="400" fill="#252625">Confirm once / close; horseback releases LT</text><text x="62" y="1213" font-size="21" font-weight="700" fill="#252625">D-Horse call</text><text x="496" y="1213" font-size="21" font-weight="400" fill="#252625">Stand or crouch first; then choose the horse call</text><text x="62" y="1251" font-size="21" font-weight="700" fill="#252625">Hold right B / tap B</text><text x="496" y="1251" font-size="21" font-weight="400" fill="#252625">Equip binoculars / stow; releasing B keeps them selected</text><text x="62" y="1289" font-size="21" font-weight="700" fill="#252625">Release B and grip</text><text x="496" y="1289" font-size="21" font-weight="400" fill="#252625">Binoculars stay equipped until a fresh B tap</text><text x="62" y="1327" font-size="21" font-weight="700" fill="#252625">Right grip + left-stick click</text><text x="496" y="1327" font-size="21" font-weight="400" fill="#252625">Switch 2x / 4x; bare left click runs; right click dives</text><text x="62" y="1365" font-size="21" font-weight="700" fill="#252625">Right trigger / A</text><text x="496" y="1365" font-size="21" font-weight="400" fill="#252625">Mark / clear; stick down changes stance</text><rect x="40" y="1424" width="1360" height="48" fill="#272928"/><text x="61" y="1457" font-size="24" font-weight="800" fill="#fffaf0">04 / GRENADES, MELEE &amp; BODIES</text><text x="62" y="1498" font-size="21" font-weight="700" fill="#252625">Support &gt; grenade</text><text x="496" y="1498" font-size="21" font-weight="400" fill="#252625">Finish wrist selection, then hold right grip</text><text x="62" y="1536" font-size="21" font-weight="700" fill="#252625">Move and tilt right hand</text><text x="496" y="1536" font-size="21" font-weight="400" fill="#252625">Position and aim the throw arc; right trigger throws</text><text x="62" y="1574" font-size="21" font-weight="700" fill="#252625">Punch / weapon bash</text><text x="496" y="1574" font-size="21" font-weight="400" fill="#252625">Deliberate motion; no punch-arming button</text><text x="62" y="1612" font-size="21" font-weight="700" fill="#252625">Right trigger, grip released</text><text x="496" y="1612" font-size="21" font-weight="400" fill="#252625">Native CQC, attack or carried-body throw</text><text x="62" y="1650" font-size="21" font-weight="700" fill="#252625">Hold left grip + B / Y</text><text x="496" y="1650" font-size="21" font-weight="400" fill="#252625">Native weapon pickup or person carry / Fulton and context</text><text x="62" y="1688" font-size="21" font-weight="700" fill="#252625">Unlocked powered arm</text><text x="496" y="1688" font-size="21" font-weight="400" fill="#252625">Equip ability, then right grip + right trigger; native charge rules</text><text x="62" y="1726" font-size="21" font-weight="700" fill="#252625">Still in development</text><text x="496" y="1726" font-size="21" font-weight="400" fill="#252625">Enemy motion-hit reactions, powered arms and physical body grabs</text><rect x="40" y="1785" width="1360" height="48" fill="#272928"/><text x="61" y="1818" font-size="24" font-weight="800" fill="#fffaf0">05 / iDROID, PAUSE &amp; TITLE</text><text x="62" y="1859" font-size="21" font-weight="700" fill="#252625">Tap left Menu</text><text x="496" y="1859" font-size="21" font-weight="400" fill="#252625">Open iDroid</text><text x="62" y="1897" font-size="21" font-weight="700" fill="#252625">Hold left Menu 0.55 seconds</text><text x="496" y="1897" font-size="21" font-weight="400" fill="#252625">Pause; inside iDroid this opens Help</text><text x="62" y="1935" font-size="21" font-weight="700" fill="#252625">Pause &gt; Return to Title Menu</text><text x="496" y="1935" font-size="21" font-weight="400" fill="#252625">A opens confirmation; choose the native confirmation</text><text x="62" y="1973" font-size="21" font-weight="700" fill="#252625">A / B / left stick</text><text x="496" y="1973" font-size="21" font-weight="400" fill="#252625">Confirm / back / navigate</text><text x="62" y="2011" font-size="21" font-weight="700" fill="#252625">Left / right grip</text><text x="496" y="2011" font-size="21" font-weight="400" fill="#252625">Native LB / RB: switch tabs</text><text x="62" y="2049" font-size="21" font-weight="700" fill="#252625">Map triggers / right click / Y</text><text x="496" y="2049" font-size="21" font-weight="400" fill="#252625">Zoom / zoom step / MAP-NAV</text><text x="62" y="2087" font-size="21" font-weight="700" fill="#252625">B / hold Menu again</text><text x="496" y="2087" font-size="21" font-weight="400" fill="#252625">Close iDroid / resume Pause</text><text x="62" y="2125" font-size="21" font-weight="700" fill="#252625">Cutscene: hold Menu</text><text x="496" y="2125" font-size="21" font-weight="400" fill="#252625">Choose Skip and press A when the native game offers it</text><rect x="40" y="2184" width="1360" height="48" fill="#272928"/><text x="61" y="2217" font-size="24" font-weight="800" fill="#fffaf0">06 / HORSE, VEHICLES &amp; VR</text><text x="62" y="2258" font-size="21" font-weight="700" fill="#252625">Horse: Y / left stick / X</text><text x="496" y="2258" font-size="21" font-weight="400" fill="#252625">Mount or dismount / ride / gallop</text><text x="62" y="2296" font-size="21" font-weight="700" fill="#252625">Vehicle: right / left trigger</text><text x="496" y="2296" font-size="21" font-weight="400" fill="#252625">Accelerate / brake or reverse</text><text x="62" y="2334" font-size="21" font-weight="700" fill="#252625">Left grip near the wheel</text><text x="496" y="2334" font-size="21" font-weight="400" fill="#252625">Acquire wheel; rotate wrist to steer; release to let go</text><text x="62" y="2372" font-size="21" font-weight="700" fill="#252625">Vehicle: left stick / Y</text><text x="496" y="2372" font-size="21" font-weight="400" fill="#252625">Conventional steering / enter or exit</text><text x="62" y="2410" font-size="21" font-weight="700" fill="#252625">Mounted: right stick left/right</text><text x="496" y="2410" font-size="21" font-weight="400" fill="#252625">Native smooth camera yaw, not a detached snap offset</text><text x="62" y="2448" font-size="21" font-weight="700" fill="#252625">settings.turn_mode</text><text x="496" y="2448" font-size="21" font-weight="400" fill="#252625">snap / native_smooth / off; native sensitivity controls smooth yaw</text><text x="62" y="2486" font-size="21" font-weight="700" fill="#252625">VR entry / optional toggle</text><text x="496" y="2486" font-size="21" font-weight="400" fill="#252625">Automatic / unbound; edit system.toggle_vr if wanted</text><text x="62" y="2524" font-size="21" font-weight="700" fill="#252625">Left grip + Menu</text><text x="496" y="2524" font-size="21" font-weight="400" fill="#252625">Recenter without changing facing</text><text x="62" y="2562" font-size="21" font-weight="700" fill="#252625">Not yet implemented</text><text x="496" y="2562" font-size="21" font-weight="400" fill="#252625">Personal-gun fire through a driver&#x27;s window</text><text x="62" y="2600" font-size="21" font-weight="700" fill="#252625">Further coverage needed</text><text x="496" y="2600" font-size="21" font-weight="400" fill="#252625">Loading, cutscenes, later abilities and vehicle states</text><rect x="40" y="2659" width="1360" height="48" fill="#272928"/><text x="61" y="2692" font-size="24" font-weight="800" fill="#fffaf0">07 / COMPLETE NATIVE BUTTON MODE</text><text x="62" y="2733" font-size="21" font-weight="700" fill="#252625">Hold Menu + A, 0.55 seconds</text><text x="496" y="2733" font-size="21" font-weight="400" fill="#252625">Switch normal VR / native inputs; release all controls after switching</text><text x="62" y="2771" font-size="21" font-weight="700" fill="#252625">A / B / X / Y</text><text x="496" y="2771" font-size="21" font-weight="400" fill="#252625">Same native buttons, including holds; B retains native pickup/carry</text><text x="62" y="2809" font-size="21" font-weight="700" fill="#252625">Left / right grip</text><text x="496" y="2809" font-size="21" font-weight="400" fill="#252625">Native LB / RB; normal VR actions are inactive in this mode</text><text x="62" y="2847" font-size="21" font-weight="700" fill="#252625">Both triggers and sticks</text><text x="496" y="2847" font-size="21" font-weight="400" fill="#252625">Native analog triggers, all stick axes and both clicks</text><text x="62" y="2885" font-size="21" font-weight="700" fill="#252625">Menu first, then left/right grip</text><text x="496" y="2885" font-size="21" font-weight="400" fill="#252625">Hold native Start / Back</text><text x="62" y="2923" font-size="21" font-weight="700" fill="#252625">Hold Menu; center and flick RS</text><text x="496" y="2923" font-size="21" font-weight="400" fill="#252625">Native D-pad direction; center again to browse with the right stick</text><text x="62" y="2961" font-size="21" font-weight="700" fill="#252625">Release Menu</text><text x="496" y="2961" font-size="21" font-weight="400" fill="#252625">Release native D-pad and finish equipment selection</text><text x="62" y="2999" font-size="21" font-weight="700" fill="#252625">Both games / menus</text><text x="496" y="2999" font-size="21" font-weight="400" fill="#252625">Input access only; does not add missing GZ first-person adapters</text><rect x="40" y="3058" width="1360" height="2" fill="#af2624"/><text x="62" y="3094" font-size="19" font-weight="400" fill="#252625">Open Edit-Controls.cmd and choose the GAME&#x27;s mgs5vr-controls.ini. Conflicts appear before saving; valid saves</text><text x="62" y="3121" font-size="19" font-weight="400" fill="#252625">keep a backup. Restart to apply.</text></g></svg>