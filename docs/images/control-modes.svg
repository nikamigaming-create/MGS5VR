<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2597" viewBox="0 0 1440 2597" role="img" aria-labelledby="title desc"><title id="title">MGS5VR complete controller modes</title><desc id="desc">Development build / 12 September 2026 / Quest Touch / Action Type</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1440" height="3000" fill="#f2efe5"/><rect x="40" y="40" width="12" height="84" fill="#af2624"/><text x="76" y="83" font-size="44" font-weight="900" fill="#252625">MGS5VR / CONTROL MODES</text><text x="77" y="119" font-size="20" font-weight="400" fill="#252625">Development build / 12 September 2026 / Quest Touch / Action Type</text><rect x="40" y="164" width="1360" height="48" fill="#272928"/><text x="61" y="197" font-size="24" font-weight="800" fill="#fffaf0">01 / MOVE &amp; HANDLE WEAPONS</text><text x="62" y="238" font-size="21" font-weight="700" fill="#252625">Left stick / right-stick click</text><text x="496" y="238" font-size="21" font-weight="400" fill="#252625">Move / dive; click means press inward</text><text x="62" y="276" font-size="21" font-weight="700" fill="#252625">Right stick left-right / up</text><text x="496" y="276" font-size="21" font-weight="400" fill="#252625">Snap turn / run; wrist mode owns this stick while open</text><text x="62" y="314" font-size="21" font-weight="700" fill="#252625">Right stick down</text><text x="496" y="314" font-size="21" font-weight="400" fill="#252625">Tap: crouch or stand / Hold: prone</text><text x="62" y="352" font-size="21" font-weight="700" fill="#252625">Right grip / trigger</text><text x="496" y="352" font-size="21" font-weight="400" fill="#252625">Hold to ready / fire or throw</text><text x="62" y="390" font-size="21" font-weight="700" fill="#252625">Left grip near support socket</text><text x="496" y="390" font-size="21" font-weight="400" fill="#252625">Guide the barrel with two hands; release grip or pull away</text><text x="62" y="428" font-size="21" font-weight="700" fill="#252625">Short B tap / hold B</text><text x="496" y="428" font-size="21" font-weight="400" fill="#252625">Reload / equip binoculars</text><text x="62" y="466" font-size="21" font-weight="700" fill="#252625">Y / A while readied / hold X</text><text x="496" y="466" font-size="21" font-weight="400" fill="#252625">Native interaction / quick weapon switch / Commands</text><text x="62" y="504" font-size="21" font-weight="700" fill="#252625">Left-stick click while readied</text><text x="496" y="504" font-size="21" font-weight="400" fill="#252625">Native weapon zoom; available steps depend on the weapon</text><text x="62" y="542" font-size="21" font-weight="700" fill="#252625">Grip, trigger and touch</text><text x="496" y="542" font-size="21" font-weight="400" fill="#252625">Articulate fingers; weapons retain their authored grip</text><rect x="40" y="601" width="1360" height="48" fill="#272928"/><text x="61" y="634" font-size="24" font-weight="800" fill="#fffaf0">02 / LEFT-WRIST EQUIPMENT</text><text x="62" y="675" font-size="21" font-weight="700" fill="#252625">Hold left trigger</text><text x="496" y="675" font-size="21" font-weight="400" fill="#252625">Unfold wrist display and wait for your choice; left stick still moves you</text><text x="62" y="713" font-size="21" font-weight="700" fill="#252625">First right-stick flick</text><text x="496" y="713" font-size="21" font-weight="400" fill="#252625">Up: primary / Down: secondary / Right: support / Left: items</text><text x="62" y="751" font-size="21" font-weight="700" fill="#252625">Center, then flick to a card</text><text x="496" y="751" font-size="21" font-weight="400" fill="#252625">All eight directions work; center between choices</text><text x="62" y="789" font-size="21" font-weight="700" fill="#252625">Release left trigger</text><text x="496" y="789" font-size="21" font-weight="400" fill="#252625">Equip and close</text><text x="62" y="827" font-size="21" font-weight="700" fill="#252625">B / A</text><text x="496" y="827" font-size="21" font-weight="400" fill="#252625">Back to categories / Use selected item</text><text x="62" y="865" font-size="21" font-weight="700" fill="#252625">Items &gt; NVG / None</text><text x="496" y="865" font-size="21" font-weight="400" fill="#252625">Night vision on / off</text><rect x="40" y="924" width="1360" height="48" fill="#272928"/><text x="61" y="957" font-size="24" font-weight="800" fill="#fffaf0">03 / COMMANDS &amp; RECON</text><text x="62" y="998" font-size="21" font-weight="700" fill="#252625">Hold X</text><text x="496" y="998" font-size="21" font-weight="400" fill="#252625">Open wrist Commands; horseback uses LT + X</text><text x="62" y="1036" font-size="21" font-weight="700" fill="#252625">Center right stick; point</text><text x="496" y="1036" font-size="21" font-weight="400" fill="#252625">Choose an available buddy or arm command</text><text x="62" y="1074" font-size="21" font-weight="700" fill="#252625">A / release X</text><text x="496" y="1074" font-size="21" font-weight="400" fill="#252625">Confirm once / close; horseback releases LT</text><text x="62" y="1112" font-size="21" font-weight="700" fill="#252625">D-Horse call</text><text x="496" y="1112" font-size="21" font-weight="400" fill="#252625">Stand or crouch first; then choose the horse call</text><text x="62" y="1150" font-size="21" font-weight="700" fill="#252625">Hold right B / tap B</text><text x="496" y="1150" font-size="21" font-weight="400" fill="#252625">Equip binoculars / stow; releasing B keeps them selected</text><text x="62" y="1188" font-size="21" font-weight="700" fill="#252625">Release B and grip</text><text x="496" y="1188" font-size="21" font-weight="400" fill="#252625">Binoculars stay equipped until a fresh B tap</text><text x="62" y="1226" font-size="21" font-weight="700" fill="#252625">Left-stick click</text><text x="496" y="1226" font-size="21" font-weight="400" fill="#252625">Switch 2x / 4x; right-stick click stays Dive</text><text x="62" y="1264" font-size="21" font-weight="700" fill="#252625">Right trigger / A</text><text x="496" y="1264" font-size="21" font-weight="400" fill="#252625">Mark / clear; stick down changes stance</text><rect x="40" y="1323" width="1360" height="48" fill="#272928"/><text x="61" y="1356" font-size="24" font-weight="800" fill="#fffaf0">04 / GRENADES, MELEE &amp; BODIES</text><text x="62" y="1397" font-size="21" font-weight="700" fill="#252625">Support &gt; grenade</text><text x="496" y="1397" font-size="21" font-weight="400" fill="#252625">Finish wrist selection, then hold right grip</text><text x="62" y="1435" font-size="21" font-weight="700" fill="#252625">Move and tilt right hand</text><text x="496" y="1435" font-size="21" font-weight="400" fill="#252625">Position and aim the throw arc; right trigger throws</text><text x="62" y="1473" font-size="21" font-weight="700" fill="#252625">Punch / weapon bash</text><text x="496" y="1473" font-size="21" font-weight="400" fill="#252625">Deliberate motion; no punch-arming button</text><text x="62" y="1511" font-size="21" font-weight="700" fill="#252625">Right trigger, grip released</text><text x="496" y="1511" font-size="21" font-weight="400" fill="#252625">Native CQC, attack or carried-body throw</text><text x="62" y="1549" font-size="21" font-weight="700" fill="#252625">Hold left grip + B / Y</text><text x="496" y="1549" font-size="21" font-weight="400" fill="#252625">Native weapon pickup or person carry / Fulton and context</text><text x="62" y="1587" font-size="21" font-weight="700" fill="#252625">Unlocked powered arm</text><text x="496" y="1587" font-size="21" font-weight="400" fill="#252625">Equip ability, then right grip + right trigger; native charge rules</text><text x="62" y="1625" font-size="21" font-weight="700" fill="#252625">Still in development</text><text x="496" y="1625" font-size="21" font-weight="400" fill="#252625">Enemy motion-hit reactions, powered arms and physical body grabs</text><rect x="40" y="1684" width="1360" height="48" fill="#272928"/><text x="61" y="1717" font-size="24" font-weight="800" fill="#fffaf0">05 / iDROID, PAUSE &amp; TITLE</text><text x="62" y="1758" font-size="21" font-weight="700" fill="#252625">Tap left Menu</text><text x="496" y="1758" font-size="21" font-weight="400" fill="#252625">Open iDroid</text><text x="62" y="1796" font-size="21" font-weight="700" fill="#252625">Hold left Menu 0.55 seconds</text><text x="496" y="1796" font-size="21" font-weight="400" fill="#252625">Pause; inside iDroid this opens Help</text><text x="62" y="1834" font-size="21" font-weight="700" fill="#252625">Pause &gt; Return to Title Menu</text><text x="496" y="1834" font-size="21" font-weight="400" fill="#252625">A opens confirmation; choose the native confirmation</text><text x="62" y="1872" font-size="21" font-weight="700" fill="#252625">A / B / left stick</text><text x="496" y="1872" font-size="21" font-weight="400" fill="#252625">Confirm / back / navigate</text><text x="62" y="1910" font-size="21" font-weight="700" fill="#252625">Left / right grip</text><text x="496" y="1910" font-size="21" font-weight="400" fill="#252625">Native LB / RB: switch tabs</text><text x="62" y="1948" font-size="21" font-weight="700" fill="#252625">Map triggers / right click / Y</text><text x="496" y="1948" font-size="21" font-weight="400" fill="#252625">Zoom / zoom step / MAP-NAV</text><text x="62" y="1986" font-size="21" font-weight="700" fill="#252625">B / hold Menu again</text><text x="496" y="1986" font-size="21" font-weight="400" fill="#252625">Close iDroid / resume Pause</text><text x="62" y="2024" font-size="21" font-weight="700" fill="#252625">Cutscene: hold Menu</text><text x="496" y="2024" font-size="21" font-weight="400" fill="#252625">Choose Skip and press A when the native game offers it</text><rect x="40" y="2083" width="1360" height="48" fill="#272928"/><text x="61" y="2116" font-size="24" font-weight="800" fill="#fffaf0">06 / HORSE, VEHICLES &amp; VR</text><text x="62" y="2157" font-size="21" font-weight="700" fill="#252625">Horse: Y / left stick / X</text><text x="496" y="2157" font-size="21" font-weight="400" fill="#252625">Mount or dismount / ride / gallop</text><text x="62" y="2195" font-size="21" font-weight="700" fill="#252625">Vehicle: right / left trigger</text><text x="496" y="2195" font-size="21" font-weight="400" fill="#252625">Accelerate / brake or reverse</text><text x="62" y="2233" font-size="21" font-weight="700" fill="#252625">Left grip near the wheel</text><text x="496" y="2233" font-size="21" font-weight="400" fill="#252625">Acquire wheel; rotate wrist to steer; release to let go</text><text x="62" y="2271" font-size="21" font-weight="700" fill="#252625">Vehicle: left stick / Y</text><text x="496" y="2271" font-size="21" font-weight="400" fill="#252625">Conventional steering / enter or exit</text><text x="62" y="2309" font-size="21" font-weight="700" fill="#252625">VR entry / optional toggle</text><text x="496" y="2309" font-size="21" font-weight="400" fill="#252625">Automatic / unbound; edit system.toggle_vr if wanted</text><text x="62" y="2347" font-size="21" font-weight="700" fill="#252625">Left grip + Menu</text><text x="496" y="2347" font-size="21" font-weight="400" fill="#252625">Recenter without changing facing</text><text x="62" y="2385" font-size="21" font-weight="700" fill="#252625">Not yet implemented</text><text x="496" y="2385" font-size="21" font-weight="400" fill="#252625">Personal-gun fire through a driver&#x27;s window</text><text x="62" y="2423" font-size="21" font-weight="700" fill="#252625">Further coverage needed</text><text x="496" y="2423" font-size="21" font-weight="400" fill="#252625">Loading, cutscenes, later abilities and vehicle states</text><rect x="40" y="2482" width="1360" height="2" fill="#af2624"/><text x="62" y="2518" font-size="19" font-weight="400" fill="#252625">Edit mgs5vr-controls.ini beside the game executable. Buttons, taps, holds and combinations are remappable per</text><text x="62" y="2545" font-size="19" font-weight="400" fill="#252625">mode. Save and restart.</text></g></svg>