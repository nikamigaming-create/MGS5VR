; MGS5VR CONTROLS -- edit this file beside the game's dinput8.dll.
; Save, then release all buttons/grips/triggers and center both sticks for 2s.
; Changes apply LIVE; invalid edits keep your last working layout. No restart.
; This file does NOT change render resolution, hand visibility or your save.
; Open Edit-Controls.cmd in the release for live validation and safe saves.
;
; HOW TO WRITE A BINDING
;   y                         active while Y is held (also supports native holds)
;   press(a)                  one press, even if you keep holding A
;   tap(b,300)                press and release B in less than 300 milliseconds
;   hold(b,300)               one action after holding B for 300 milliseconds
;   release(a)                one action when A is released
;   press(left_grip + x)      hold left grip, then press X (a combination/chord)
;   press(a) | press(x)       either input works
;   disabled                  turn this binding off
;
; INPUT NAMES (A/B are RIGHT hand; X/Y and Menu are LEFT hand)
;   a, b, x, y, menu
;   left_trigger, right_trigger, left_grip, right_grip
;   left_stick_click, right_stick_click
;   left_stick_up, left_stick_down, left_stick_left, left_stick_right
;   right_stick_up, right_stick_down, right_stick_left, right_stick_right
;
; Use + INSIDE the parentheses for a chord. Extra spaces are fine.
; The longest active chord wins over a simpler button in the same mode.
; Its short tap will NOT fire when you release the chord.
; A tap and hold sharing one button must use the SAME duration.
; Holds may be 100..3000 ms. A plain input stays down; hold(...) fires ONCE.
; Stick-direction actions require centering before another direction.
; After menu/focus changes, release held buttons and center sticks once.
;
; MODE RULES
; Actions are mode-specific. [system] is always available; [turn] and
; equipment/command opening also work in the gameplay modes noted below.
; Menus / Commands / equipment / binoculars take priority over gameplay.
; Same button in different modes is OK. Conflicting bindings in the SAME
; mode are reported with their names; an invalid file uses built-in defaults.
; Check edits before playing: mgs5vr_controls.exe --check mgs5vr-controls.ini
; Error details also appear in mgs5vr.log. Missing keys keep their defaults.

[system]
; Menu tap opens iDroid; hold opens Pause (native Help while inside iDroid).
idroid = tap(menu,550)
pause = hold(menu,550)
; Recenter does not change your facing. No iDroid/Pause action leaks through.
recenter = press(left_grip + menu)
; Deliberately OFF: left-grip + stick-click used to steal your dive input.
; Optional deliberate toggle example: hold(left_grip + y,1000)
toggle_vr = disabled
; Full native-controller access without changing the normal VR layout.
; Hold Menu + right A for 0.55 seconds to switch ON/OFF, then release controls.
; This switches INPUT only; it does not switch VR/theatre presentation.
native_buttons = hold(menu + a,550)

[native]
; COMPLETE NATIVE BUTTONS -- used only while native-buttons mode is ON.
; All game-facing Xbox inputs are mapped below; ordinary VR bindings are idle.
; Plain bindings stay held, so native holds, partial triggers and combinations
; work. The game decides the contextual action, availability and unlock rules.
; A/B/X/Y match native prompts. Grips are LB/RB; triggers are native LT/RT.
; This also works in GZ and native menus without a tracked-player adapter.
a = a
b = b
x = x
y = y
left_shoulder = left_grip
right_shoulder = right_grip
left_trigger = left_trigger
right_trigger = right_trigger
left_click = left_stick_click
right_click = right_stick_click
; Hold Menu FIRST, then the named grip. These remain down until released.
start = left_grip + menu
back = right_grip + menu
; D-PAD: hold Menu, center the RIGHT stick, then flick a direction once.
; Center again: the native D-pad button stays held while the right stick is
; free to browse native equipment cards. Release Menu to equip/close.
; No category is sent merely by holding Menu. Left stick remains available.
dpad_hold = menu
dpad_up = menu + right_stick_up
dpad_down = menu + right_stick_down
dpad_left = menu + right_stick_left
dpad_right = menu + right_stick_right
; For direct D-pad button/chord assignments without the latched picker,
; set dpad_hold = disabled and replace the four bindings above.
; Both sticks are configured as axes.native_move / axes.native_look below.
; Return to normal VR controls: hold Menu + A for 0.55 seconds and release.
; Native camera/ability behavior is not a completed VR presentation adapter.

[gameplay]
; On foot. Left stick moves; head direction sets forward. See [axes].
; Normal VR follows the native gamepad prompts wherever possible: A is stance,
; B is pickup/carry, Y is context, and X opens Commands. The four intentional
; VR exceptions are listed on each action and are printed by the wrist picker.
; Left-stick click is sprint; right-stick up is the fitted weapon-scope zoom.
run = left_stick_click
; Native stance button: TAP A = crouch/stand; HOLD A = prone.
; This is native tap/hold behavior, NOT an automatic three-position cycle.
stance = a
; Click means press the stick inward, not push it in a direction.
; Right click dives on foot, including with binoculars out.
dive = press(right_stick_click)
; Native context action: climb, mount, Fulton, etc. when offered.
; Keep a plain binding here so native "hold button" prompts still work.
; With C4 or a decoy selected: HOLD right grip, then Y to remotely detonate
; placed C4 / inflate thrown decoys. Right trigger places or throws them first.
interact = y
; Chorded with left_grip so bare B stays the native pickup/carry prompt.
; A plain hold and a tap sharing one bare button are not safely
; distinguishable, so the two native actions have different bases.
reload = tap(left_grip + b,300)
; Plain hold: raw B stays down the whole time B is held, which is what
; native pickup/carry needs.
pickup_carry = b
ready_weapon = right_grip
; Squeeze near the weapon's authored support socket; release to free the hand.
; In empty space this only curls your fingers. It does not reload the weapon.
support_grip = left_grip
; Keep right grip down, then press right stick click to quick-switch while
; ready. The longer chord consumes Dive for this one input.
switch_weapon = press(right_grip + right_stick_click)
; Cycle the equipped physical scope's native zoom powers while weapon-ready.
; Fixed-power sights stay at their one power. The surrounding world never zooms.
zoom = press(right_stick_up)
; With weapon ready: shoot / throw selected grenade / activate equipped arm.
; With weapon lowered: native CQC, attack or carried-body throw.
fire_or_cqc = right_trigger
; Equips into the right hand. Hold left grip + Y for 0.3 seconds, then release;
; binoculars stay selected. A fresh B press stows them. The chord is separate
; from bare Y context and bare B pickup, while left grip alone still supports.
equip_binoculars = hold(left_grip + y,300)
; Optional direct native alternatives. Kept OFF: the normal prompt-matching
; actions above already own their buttons; native-button mode remains complete.
native_a = disabled
native_x = disabled
native_left_shoulder = disabled
native_right_shoulder = disabled
native_right_click = disabled
; Direct native D-pad routes for custom layouts/weapon-specific native actions.
; These bypass the wrist category chooser; OFF to avoid duplicate selection.
; Example custom chord: native_dpad_up = press(right_grip + x)
; Native behavior depends on the equipped weapon/state; this is not a universal
; alternate-fire implementation. It does not provide new sight rendering.
native_dpad_up = disabled
native_dpad_down = disabled
native_dpad_left = disabled
native_dpad_right = disabled

[equipment]
; HOLD to show the four labeled Primary / Secondary / Support / Items cards.
; The small ammo/status HUD stays on the wrist; it is not the selector.
; It waits for a fresh category selection.
; Release without choosing: no category button is sent to the game.
; Release after choosing: the native picker finishes selection and closes.
open = left_trigger
; First choose a category. After its cards appear, center, then point to a card.
; Category inputs are remappable; the card-browsing stick is in [axes].
primary = right_stick_up
secondary = right_stick_down
support = right_stick_right
items = right_stick_left
back = press(b)
; Only an item showing the game's Use prompt supports this action.
use = press(a)
; NVG is selected through Items; select None to turn it off.
; Grenades use Support, then ready_weapon + fire_or_cqc; aim with your hand.

[commands]
; Interrogation / buddy orders / arm distraction / native available calls.
; Hold up or restrain the target FIRST, then keep that grip/trigger held while
; opening Commands. Existing weapon-ready/CQC holds continue; new attacks do not.
; Release that grip/trigger to stop holding it. A confirms only the menu choice.
; This fixes input continuity; complete guard/CQC target behavior is still under
; development. There is no automatic grab, choke, knife kill or interrogation.
open = press(x)
; Keep this input held while choosing. Releasing it closes Commands.
keep_open = x
; On horseback, X alone is gallop: hold LT and tap X, then keep LT held.
mounted_open = press(left_trigger + x)
mounted_keep_open = left_trigger
confirm = press(a)
back = press(b)
; Navigation is in [axes]. Native availability depends on stance/unlocks/buddy.

[binoculars]
; This mode owns input at ALL carry distances, not just at the eye.
stow = press(b)
zoom = press(left_stick_click)
mark = press(right_trigger)
clear_mark = press(a)
support_grip = left_grip
run = right_stick_up
dive = press(right_stick_click)
; Right-stick up runs; left-click zooms; right-click dives.
stance = right_stick_down
; Move and snap-turn remain available. Lens opens by bringing ocular to eye.
; Start at 2x; each zoom press switches 2x -> 4x -> 2x. Keep the housing near
; the eye to look through it. Lowering it does not change the chosen power.
; Only the physical lens zooms, not the surrounding world or headset views.
; Automatic intel analysis is not implemented.

[turn]
; Gameplay, binoculars, horse and vehicle. Menus own their navigation instead.
left = right_stick_left
right = right_stick_right

[menus]
; Native iDroid, Pause, Title, dialogue and blocking game menus.
; Do not disable both confirm and back: keep an escape route.
confirm = a
back = b
action_x = x
action_y = y
previous_tab = left_grip
next_tab = right_grip
left_trigger = left_trigger
right_trigger = right_trigger
left_click = left_stick_click
right_click = right_stick_click
; Optional native D-pad for theatre/adapter-independent gameplay and menus.
; These are NOT extra triggers for the tracked wrist equipment selector.
; Bind to buttons or stick directions as needed; when using right-stick
; directions here, set [axes].map=disabled to avoid also moving the native camera.
dpad_up = disabled
dpad_down = disabled
dpad_left = disabled
dpad_right = disabled
; In iDroid: triggers zoom, right click changes zoom step, Y switches MAP/NAV.
; Cutscene skip: hold Menu, then use the native Skip option if available.

[horse]
; [axes].move rides. Weapon-ready/fire and equipment also work while mounted.
gallop = x
interact = y
stance = a
reload = b
left_click = left_stick_click
right_click = right_stick_click
; Release ready_weapon and let the native stow finish before dismounting.

[vehicle]
; Native vehicle controls. This does NOT add firing your personal gun while driving.
accelerate = right_trigger
brake_reverse = left_trigger
wheel_grip = left_grip
equipment_open = right_grip
interact = y
weapon_or_call = x
native_a = a
native_b = b
left_click = left_stick_click
right_click = right_stick_click
; Hold wheel_grip with LEFT hand near the steering wheel, rotate hand to steer.
; Otherwise use [axes].vehicle_steering. Mounted weapons retain native limits.
; The right stick remains the native camera/turret look axis (both directions).

[axes]
; Axis values ONLY: left_stick, right_stick, disabled. No tap/hold/chords here.
move = left_stick
equipment = right_stick
commands = right_stick
menu = right_stick
map = right_stick
vehicle_steering = left_stick
; Only native-buttons mode: direct native movement and camera/menu sticks.
native_move = left_stick
native_look = right_stick
; Normal VR only, with turn_mode = native_smooth: native horizontal yaw.
turn = right_stick

[settings]
; native_smooth (default) / snap / off. Smooth uses the game's native yaw input and
; sensitivity; headset pitch stays tracked. Menus retain both navigation axes.
; Horses/vehicles use native camera yaw even with snap, not a detached VR snap.
turn_mode = native_smooth
; binoculars_only (default): enhanced world cues only while looking through
; the binocular lens. Merely holding it, or using a rifle scope, does not count.
; full: also show world cues in normal VR. off: no enhanced world cues.
; These modes do not suppress wrist controls or the general caption/HUD layer.
; Caption restoration and some objective labels are still incomplete.
; The game's own marker preferences still apply.
hud_mode = binoculars_only
snap_turn_degrees = 30
; Binocular fit relative to the runtime's controller aim; -180..180 degrees.
; Default -90 tilts the binoculars DOWN 90 degrees into the palm. Positive tilts up.
; Zero restores the old aim-aligned fit. Palms cup the sides, fingers curl over the top.
; Housing, lens/ray and cupped hands rotate together around the primary palm position.
binocular_pitch_degrees = -90
binocular_yaw_degrees = 0
binocular_roll_degrees = 0
; Mark a visible person by holding the binocular sight on them. Only runs with
; the ocular at your eye; no automatic waypoints and no marking through cover.
; Trigger still marks immediately. A deliberate clear stays cleared until you
; look away. 0 disables automatic marking; delay range is 100..3000 ms.
binocular_auto_mark = 1
; Native actor glow follows hud_mode. 0 removes the glowing body but keeps
; binocular target labels, acquisition and ordinary people intact.
binocular_actor_glow = 1
binocular_mark_dwell_ms = 650
; Extra clearance above the wrist surface; centimetres, 0..10.
wrist_surface_lift_cm = 2
; Height of the four-category bar/native picker above the wrist; cm, 5..30.
wrist_selector_height_cm = 15
; Width of the unfolded native equipment layout; cm, 42..100. Larger = clearer
; cards/text. It stays anchored above the wrist and does not enlarge the skin HUD.
wrist_picker_width_cm = 42
; Width of the hand-carried iDroid screen; cm, 20..60. Height stays 16:9.
; Larger values improve legibility but remain bounded so the map stays near the hand.
idroid_screen_width_cm = 30
; Comfortable eye-to-scope-glass distance; cm, 3..20. Does not move the weapon.
scope_eye_relief_cm = 10
; 1 = on, 0 = off. These are physical gestures, not button assignments.
motion_melee = 1
animal_touch = 1
; Melee: deliberate free-hand punch or readied-weapon bash; retract to repeat.
; Animal touch: open-palm D-Dog petting / ground-level rat pickup and set-down.
; Weapon support: squeeze left grip near its support socket; release/pull away.
; Fingers still follow physical grip/trigger/touch, regardless of button remaps.
; Physical grabbing of bodies, manual magazine reloads, holographic/reflex sights,
; universal cutscene skipping and automatic binocular intel are NOT implemented.
; Round rifle/sidearm and four launcher lenses use their authored sight sockets.
; A working launcher lens does not implement or certify guided target lock-on.
