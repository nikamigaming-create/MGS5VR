; MGS5VR CONTROLS -- edit this file beside the game's dinput8.dll.
; Save, then restart MGSV. No rebuild is needed for binding changes.
; This file does NOT change graphics, tracking, hand visibility or your save.
;
; HOW TO WRITE A BINDING
;   y                         active while Y is held (also supports native holds)
;   press(a)                  one press, even if you keep holding A
;   tap(b,300)                press and release B in less than 300 milliseconds
;   hold(b,300)               one action after holding B for 300 milliseconds
;   release(a)                one action when A is released
;   press(left_grip + x)      hold left grip, then press X (a combination/chord)
;   press(a) | press(x)       either input works
;   disabled                  turn this binding off
;
; INPUT NAMES (A/B are RIGHT hand; X/Y and Menu are LEFT hand)
;   a, b, x, y, menu
;   left_trigger, right_trigger, left_grip, right_grip
;   left_stick_click, right_stick_click
;   left_stick_up, left_stick_down, left_stick_left, left_stick_right
;   right_stick_up, right_stick_down, right_stick_left, right_stick_right
;
; Use + INSIDE the parentheses for a chord. Extra spaces are fine.
; The longest active chord wins over a simpler button in the same mode.
; Its short tap will NOT fire when you release the chord.
; A tap and hold sharing one button must use the SAME duration.
; Holds may be 100..3000 ms. A plain input stays down; hold(...) fires ONCE.
; Stick-direction actions require centering before another direction.
; After menu/focus changes, release held buttons and center sticks once.
;
; MODE RULES
; Actions are mode-specific. [system] is always available; [turn] and
; equipment/command opening also work in the gameplay modes noted below.
; Menus / Commands / equipment / binoculars take priority over gameplay.
; Same button in different modes is OK. Conflicting bindings in the SAME
; mode are reported with their names; an invalid file uses built-in defaults.
; Check edits before playing: mgs5vr_controls.exe --check mgs5vr-controls.ini
; Error details also appear in mgs5vr.log. Missing keys keep their defaults.

[system]
; Menu tap opens iDroid; hold opens Pause (native Help while inside iDroid).
idroid = tap(menu,550)
pause = hold(menu,550)
; Recenter does not change your facing. No iDroid/Pause action leaks through.
recenter = press(left_grip + menu)
; Deliberately OFF: left-grip + stick-click used to steal your dive input.
; Optional deliberate toggle example: hold(left_grip + y,1000)
toggle_vr = disabled

[gameplay]
; On foot. Left stick moves; head direction sets forward. See [axes].
run = right_stick_up
; Native stance button: TAP down = crouch/stand; HOLD down = prone.
; This is native tap/hold behavior, NOT an automatic three-position cycle.
stance = right_stick_down
; Click means press the stick inward, not push it in a direction.
; Right click dives on foot, including with binoculars out.
; Prefer left click everywhere? Change this to press(left_stick_click).
dive = press(right_stick_click)
; Native context action: climb, mount, Fulton, etc. when offered.
; Keep a plain binding here so native "hold button" prompts still work.
interact = y
reload = tap(b,300)
; Native B HOLD is needed to pick up weapons and carry people. Hold LEFT GRIP
; first, then hold B at the prompt. This sends a continuous B, lowers aim, and
; does not equip binoculars or fire a short reload when the chord is released.
pickup_carry = left_grip + b
ready_weapon = right_grip
; Squeeze near the weapon's authored support socket; release to free the hand.
; In empty space this only curls your fingers. It does not reload the weapon.
support_grip = left_grip
; Native X switches weapon while aiming. Separate from your stick-click dive.
; A does nothing while lowered, so quick-switch cannot accidentally dive.
switch_weapon = press(a)
; Cycle the equipped physical scope's native zoom powers while weapon-ready.
; Fixed-power sights stay at their one power. The surrounding world never zooms.
zoom = press(left_stick_click)
; With weapon ready: shoot / throw selected grenade / activate equipped arm.
; With weapon lowered: native CQC, attack or carried-body throw.
fire_or_cqc = right_trigger
; Equips into the right hand. Release B/grip: stays equipped. B stows below.
equip_binoculars = hold(b,300)
; Optional direct native alternatives. OFF so face buttons do not duplicate
; stance or dive. Native A is stance; native X is dive during normal play.
native_a = disabled
native_x = disabled
native_left_shoulder = disabled
native_right_shoulder = disabled
native_right_click = disabled

[equipment]
; HOLD to show the four labeled Primary / Secondary / Support / Items cards.
; The small ammo/status HUD stays on the wrist; it is not the selector.
; It waits for a fresh category selection.
; Release without choosing: no category button is sent to the game.
; Release after choosing: the native picker finishes selection and closes.
open = left_trigger
; First choose a category. After its cards appear, center, then point to a card.
; Category inputs are remappable; the card-browsing stick is in [axes].
primary = right_stick_up
secondary = right_stick_down
support = right_stick_right
items = right_stick_left
back = press(b)
; Only an item showing the game's Use prompt supports this action.
use = press(a)
; NVG is selected through Items; select None to turn it off.
; Grenades use Support, then ready_weapon + fire_or_cqc; aim with your hand.

[commands]
; Buddy orders / arm distraction / native available calls. Not a second weapon menu.
open = press(x)
; Keep this input held while choosing. Releasing it closes Commands.
keep_open = x
; On horseback, X alone is gallop: hold LT and tap X, then keep LT held.
mounted_open = press(left_trigger + x)
mounted_keep_open = left_trigger
confirm = press(a)
back = press(b)
; Navigation is in [axes]. Native availability depends on stance/unlocks/buddy.

[binoculars]
; This mode owns input at ALL carry distances, not just at the eye.
stow = press(b)
zoom = press(left_stick_click)
mark = press(right_trigger)
clear_mark = press(a)
support_grip = left_grip
run = right_stick_up
dive = press(right_stick_click)
; The same stick clicks keep the same jobs: left zoom, right Dive.
stance = right_stick_down
; Move and snap-turn remain available. Lens opens by bringing ocular to eye.
; Start at 2x; each zoom press switches 2x -> 4x -> 2x. Keep the housing near
; the eye to look through it. Lowering it does not change the chosen power.
; Only the physical lens zooms, not the surrounding world or headset views.
; Automatic intel analysis is not implemented.

[turn]
; Gameplay, binoculars, horse and vehicle. Menus own their navigation instead.
left = right_stick_left
right = right_stick_right

[menus]
; Native iDroid, Pause, Title, dialogue and blocking game menus.
; Do not disable both confirm and back: keep an escape route.
confirm = a
back = b
action_x = x
action_y = y
previous_tab = left_grip
next_tab = right_grip
left_trigger = left_trigger
right_trigger = right_trigger
left_click = left_stick_click
right_click = right_stick_click
; Optional native D-pad for theatre/adapter-independent gameplay and menus.
; These are NOT extra triggers for the tracked wrist equipment selector.
; Bind to buttons or stick directions as needed; when using right-stick
; directions here, set [axes].map=disabled to avoid also moving the native camera.
dpad_up = disabled
dpad_down = disabled
dpad_left = disabled
dpad_right = disabled
; In iDroid: triggers zoom, right click changes zoom step, Y switches MAP/NAV.
; Cutscene skip: hold Menu, then use the native Skip option if available.

[horse]
; [axes].move rides. Weapon-ready/fire and equipment also work while mounted.
gallop = x
interact = y
stance = a
reload = b
left_click = left_stick_click
right_click = right_stick_click
; Release ready_weapon and let the native stow finish before dismounting.

[vehicle]
; Native vehicle controls. This does NOT add firing your personal gun while driving.
accelerate = right_trigger
brake_reverse = left_trigger
wheel_grip = left_grip
equipment_open = right_grip
interact = y
weapon_or_call = x
native_a = a
native_b = b
left_click = left_stick_click
right_click = right_stick_click
; Hold wheel_grip with LEFT hand near the steering wheel, rotate hand to steer.
; Otherwise use [axes].vehicle_steering. Mounted weapons retain native limits.

[axes]
; Axis values ONLY: left_stick, right_stick, disabled. No tap/hold/chords here.
move = left_stick
equipment = right_stick
commands = right_stick
menu = left_stick
map = right_stick
vehicle_steering = left_stick

[settings]
snap_turn_degrees = 30
; Extra clearance above the wrist surface; centimetres, 0..10.
wrist_surface_lift_cm = 2
; Height of the four-category bar/native picker above the wrist; cm, 5..30.
wrist_selector_height_cm = 12
; Comfortable eye-to-scope-glass distance; cm, 3..20. Does not move the weapon.
scope_eye_relief_cm = 10
; 1 = on, 0 = off. These are physical gestures, not button assignments.
motion_melee = 1
animal_touch = 1
; Melee: deliberate free-hand punch or readied-weapon bash; retract to repeat.
; Animal touch: open-palm D-Dog petting / ground-level rat pickup and set-down.
; Weapon support: squeeze left grip near its support socket; release/pull away.
; Fingers still follow physical grip/trigger/touch, regardless of button remaps.
; Physical grabbing of bodies, manual magazine reloads, holographic/reflex and
; launcher optics, universal cutscene skipping and automatic binocular intel
; are NOT implemented. Round rifle scopes use their authored sight sockets.
