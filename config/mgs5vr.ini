; Native stereo VR defaults for a manual installation beside mgsvtpp.exe.
; The launcher imports the required owned assets and preserves existing settings.
; Physical-headset acceptance remains separate from automated checks.
[theatre]
enabled=1
width_cm=1200
distance_cm=600

[diagnostics]
; Optional local developer command pipe. Title-state detection is always available.
native_actions=0
; Read-only camera setter observations. Does not enable head tracking.
camera_observer=1
; Optional absolute private directory for bounded camera-owner snapshots.
camera_evidence_dir=
; TPP enters tracked VR automatically; edit optional toggles in mgs5vr-controls.ini.
; Replays both native eye draws within one scene transaction; acceptance incomplete.
; Tracked arms and the left-arm weapon HUD have separate opt-ins below.
head_camera_experiment=1
; Native tracked-arm/firearm experiment. Requires head_camera_experiment.
controller_rig_experiment=1
; Live native weapon/status pixels on the left forearm; general HUD stays separate.
; World cue visibility is settings.hud_mode in mgs5vr-controls.ini.
; Requires controller_rig_experiment. The handheld optic renders a separate 2x/4x scene.
wrist_hud_experiment=1

[optics]
; Exact retail binocular model recovered from the player's owned installation.
; The renderer fails closed if this FMDL is absent; no substitute geometry is used.
binocular_fmdl=retail-assets\Assets\tpp\item\tel\Scenes\tel0_main0_def.fmdl
binocular_diffuse_dds=retail-assets\Assets\tpp\item\tel\Pictures\tel0_main0_def_c00_bsm.dds

[opening]
; Release default: use the complete native title menu and normal Continue path.
; Experimental cassette/actor cabin stays opt-in until its full handoff passes.
interactive_cabin=0
; The title-cabin D-Dog layer uses only assets imported from this player's
; owned TPP installation. Missing or invalid paths retain the native title panel.
dog_fmdl=retail-assets\Assets\tpp\chara\ddg\Scenes\ddg0_main0_def.fmdl
dog_diffuse_dds=retail-assets\Assets\tpp\chara\ddg\Pictures\ddg0_body0_def_c00_bsm.dds
; Optional owned rat meshes for the post-loading cabin sandbox. Native rat
; instances remain the source of interaction and are placed within the cabin.
rat_fmdl=retail-assets\Assets\tpp\chara\rat\Scenes\rat0_main0_def.fmdl
rat_diffuse_dds=retail-assets\Assets\tpp\chara\rat\Pictures\rat0_body0_def_c00_bsm.dds
