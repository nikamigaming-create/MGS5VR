; Development preview with optional native same-frame stereo experiment.
; Native stereo, tracked arms and wrist HUD are opt-in experiments; physical acceptance is incomplete.
; Install with tools/install.ps1 -EnableVR for tracked VR, hands and the left-wrist HUD.
[theatre]
enabled=0
width_cm=800
distance_cm=600

[diagnostics]
; Read-only camera setter observations. Does not enable head tracking.
camera_observer=0
; Optional absolute private directory for bounded camera-owner snapshots.
camera_evidence_dir=
; Experimental native render-camera tracking; manually toggle with left grip + left stick click.
; Replays both native eye draws within one scene transaction; acceptance incomplete.
; Tracked arms and the left-arm weapon HUD have separate opt-ins below.
head_camera_experiment=0
; Native tracked-arm/firearm experiment. Requires head_camera_experiment.
controller_rig_experiment=0
; Live native weapon/status pixels on the left forearm; hides flat gameplay marker/reticle layers.
; Requires controller_rig_experiment. The handheld optic renders a separate 2x/4x scene.
wrist_hud_experiment=0

[optics]
; Exact retail binocular model recovered from the player's owned installation.
; The renderer fails closed if this FMDL is absent; no substitute geometry is used.
binocular_fmdl=retail-assets\Assets\tpp\item\tel\Scenes\tel0_main0_def.fmdl
binocular_diffuse_dds=retail-assets\Assets\tpp\item\tel\Pictures\tel0_main0_def_c00_bsm.dds
