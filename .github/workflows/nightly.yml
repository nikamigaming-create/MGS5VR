name: Nightly release

on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'nikamigaming-create/MGS5VR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: plan
        name: Check policy and skip an already published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/nightly.py plan

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      nightly: true
      nightly_tag: ${{ needs.plan.outputs.tag }}
      previous_commit: ${{ needs.plan.outputs.previous }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-release-payload
          path: build/nightly-release
      - name: Verify uploads before publishing the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/nightly.py publish
