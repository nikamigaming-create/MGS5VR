name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch pinned open-source dependencies
        run: ./tools/bootstrap.ps1
      - name: Configure Windows x64
        run: cmake --preset windows-x64
      - name: Build all targets
        run: cmake --build --preset release --parallel
      - name: Run tests that do not require a GPU or headset
        run: ctest --preset release --exclude-regex d3d11_mailbox --output-junit build/ci-tests.xml
      - name: Check Python tooling
        run: python -m compileall -q tools
      - name: Assemble development install tree
        run: cmake --install build --config Release --component MGS5VR --prefix dist/MGS5VR-development
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-evidence
          path: |
            build/ci-tests.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Upload experimental development build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MGS5VR-experimental-windows-x64
          path: dist/MGS5VR-development/
          if-no-files-found: error
